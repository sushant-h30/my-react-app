pipeline:
  name: apex-workflow
  identifier: apexworkflow
  description: CI pipeline for React app - builds, lints, and tests
  projectIdentifier: apexworkflow
  orgIdentifier: default
  tags:
    ai_generated: ""
  stages:
    - stage:
        name: Dev
        identifier: Dev
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and Test
                  identifier: Run_1
                  spec:
                    command: |-
                      echo "=== Building React App ==="
                      
                      npm install
                      npm run lint
                      npm run build
                      
                      echo ""
                      echo "=== Build Complete ==="
  properties:
    ci:
      codebase:
        connectorRef: Git_Account
        repoName: my-react-app
        build: <+input>
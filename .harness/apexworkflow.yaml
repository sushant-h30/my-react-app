pipeline:
  name: apex-workflow
  identifier: apexworkflow
  description: CI pipeline for React app - builds, lints, and tests
  projectIdentifier: apexworkflow
  orgIdentifier: default
  tags:
    ai_generated: ""
  stages:
    - stage:
        name: Dev
        identifier: Dev
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Docker
            spec:
              harnessImageConnectorRef: account.harnessImage
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and Test
                  identifier: Run_1
                  spec:
                    shell: Sh
                    command: |-
                      set -e

                      $HARNESS_WORKSPACE/bi/auto-injection || true

                      export NVM_DIR="/home/sushant/.nvm"
                      . "$NVM_DIR/nvm.sh"
                      nvm use 24

                      echo "=== Node Environment ==="
                      which node
                      which npm
                      node -v
                      npm -v
                      node -p "process.platform"
                      npm config get cache

                      echo "=== Fixing Workspace Permissions ==="
                      sudo chown -R "$(whoami):$(id -gn)" "$HARNESS_WORKSPACE"

                      echo "=== Workspace Permissions ==="
                      ls -ld "$HARNESS_WORKSPACE"
                      ls -l "$HARNESS_WORKSPACE/package-lock.json"

                      echo "=== Building React App ==="

                      npm install --package-lock=false
                      npm run lint
                      npm run build

                      echo ""
                      echo "=== Build Complete ==="
  properties:
    ci:
      codebase:
        connectorRef: Git_Account
        repoName: my-react-app
        build: <+input>
